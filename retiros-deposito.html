<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retiros de depósito | DMTH</title><style>
:root{--blue:#0b4f8a;--bg:#eef3f7;--line:#d5e0e8}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:#1d2935}header{background:var(--blue);color:#fff;padding:18px max(16px,calc((100% - 1100px)/2))}h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.8}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;margin-bottom:14px}.btn{border:0;border-radius:7px;padding:10px 14px;background:#dbe7f0;color:#17324d;font-weight:bold;cursor:pointer}.btn.primary,.tabs .active{background:var(--blue);color:#fff}.btn.line{background:#fff;border:1px solid var(--blue)}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.full{grid-column:1/-1}label{display:block;margin-bottom:4px;font-weight:bold;color:#17324d}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:70px}.items{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:8px 0}.actions{margin-top:18px;display:flex;justify-content:flex-end;gap:8px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{max-width:340px}table{width:100%;border-collapse:collapse}th{background:var(--blue);color:#fff;text-align:left;padding:9px}td{padding:9px;border-bottom:1px solid var(--line)}.table{overflow:auto}.print{max-width:780px;margin:auto;background:#fff;padding:8px}.copy{border:1px solid #455;margin:8px 0 20px}.title{background:var(--blue);color:white;text-align:center;padding:8px;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #aab}.row div,.line{padding:6px;border-right:1px solid #aab;min-height:28px}.line{display:grid;grid-template-columns:2fr 1fr 1fr}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:35px 7px 8px;text-align:center;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.items{grid-template-columns:1fr 1fr auto}.toolbar{flex-wrap:wrap}}@media print{body>*:not(#print){display:none!important}#print{display:block!important}.print{max-width:none}.tabs,.actions{display:none!important}}
</style></head><body><header><h1>Solicitud de retiro de insumos</h1><p>Depósito · Librería · Higiene personal · Limpieza y otros insumos</p></header><main class="wrap"><nav class="tabs"><button class="btn active" data-tab="form">+ Nueva solicitud</button><button class="btn" data-tab="history">Historial y reimpresión</button></nav><section id="form" class="panel"><form id="f"><input id="id" type="hidden"><div class="grid"><div><label>Fecha *</label><input id="fecha" type="date" required></div><div><label>Estado</label><select id="estado"></select></div><div><label>Solicitante *</label><input id="solicitante" required placeholder="Nombre y apellido"></div><div><label>Sector solicitante *</label><select id="sector" required></select></div><div><label>Categoría *</label><select id="categoria" required></select></div><div><label>Entregado por</label><input id="entregadoPor" placeholder="Completa depósito al entregar"></div><div class="full"><label>Observaciones</label><textarea id="observaciones" placeholder="Motivo o detalle adicional"></textarea></div></div><h3>Artículos solicitados</h3><div id="items"></div><button class="btn line" type="button" id="add">+ Agregar artículo</button><div class="actions"><button class="btn line" type="button" id="reset">Cancelar</button><button class="btn primary">Guardar solicitud</button></div></form></section><section id="history" class="panel hidden"><div class="toolbar"><input id="q" placeholder="Buscar por código, solicitante o artículo"><button class="btn primary" id="search">Buscar</button></div><div class="table"><table><thead><tr><th>Código</th><th>Fecha</th><th>Solicitante / sector</th><th>Insumos</th><th>Estado</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section></main><section id="print" class="hidden"></section><script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwR7MP7giX05UgRslmsK3_jvUqjQHrobvOxF3RdSiZpEWaSzxvTzhdxlCnXZnEtsCg/exec';const $=x=>document.getElementById(x);let opts={},rows=[];const api=async(a,d={},post=false)=>{const u=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action='+a;const r=post?await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify({action:a,...d})}):await fetch(u);return r.json()};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fill(id,a,blank='Seleccionar…'){$(id).innerHTML='<option value="">'+blank+'</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join('')}function item(v={}){const d=document.createElement('div');d.className='items';d.innerHTML='<input class="art" placeholder="Artículo / insumo"><input class="qty" placeholder="Cantidad"><select class="unit"></select><button class="btn line" type="button">Quitar</button>';d.querySelector('.unit').innerHTML='<option value="">Unidad</option>'+opts.unidades.map(x=>'<option>'+esc(x)+'</option>').join('');d.querySelector('.art').value=v.articulo||'';d.querySelector('.qty').value=v.cantidad||'';d.querySelector('.unit').value=v.unidad||'';d.querySelector('button').onclick=()=>d.remove();$('items').append(d)}function reset(){$('f').reset();$('id').value='';$('fecha').value=new Date().toISOString().slice(0,10);$('estado').value='PENDIENTE';$('items').innerHTML='';item()}function data(){return{id:$('id').value,fecha:$('fecha').value,solicitante:$('solicitante').value,sector:$('sector').value,categoria:$('categoria').value,estado:$('estado').value,entregadoPor:$('entregadoPor').value,observaciones:$('observaciones').value,items:[...document.querySelectorAll('.items')].map(d=>({articulo:d.querySelector('.art').value,cantidad:d.querySelector('.qty').value,unidad:d.querySelector('.unit').value})).filter(x=>x.articulo)}}function tab(v){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===v));$('form').classList.toggle('hidden',v!=='form');$('history').classList.toggle('hidden',v!=='history');if(v==='history')search()}async function search(){const r=await api('retiros',{q:$('q').value});rows=r.retiros||[];$('body').innerHTML=rows.map((x,i)=>'<tr><td><b>'+esc(x.id)+'</b></td><td>'+esc(x.fecha)+'</td><td>'+esc(x.solicitante)+'<br><small>'+esc(x.sector)+'</small></td><td>'+esc(x.items.map(a=>a.articulo).join(', '))+'</td><td>'+esc(x.estado)+'</td><td><button class="btn line" onclick="edit('+i+')">Editar</button> <button class="btn primary" onclick="printR('+i+')">Imprimir</button></td></tr>').join('')}window.edit=i=>{const x=rows[i];tab('form');$('id').value=x.id;$('fecha').value=(x.fecha.match(/(\d{2})\/(\d{2})\/(\d{4})/)||[]).slice(1).reverse().join('-')||x.fecha;['solicitante','sector','categoria','estado','entregadoPor','observaciones'].forEach(k=>$(k).value=x[k]||'');$('items').innerHTML='';x.items.forEach(item)};window.printR=i=>{const x=rows[i],items=[...x.items,...Array(5)].slice(0,5);const copy=l=>'<div class="copy"><div class="title">SOLICITUD DE RETIRO — '+esc(x.id)+' | '+l+'</div><div class="row"><div>FECHA: '+esc(x.fecha)+'</div><div>SECTOR: '+esc(x.sector)+'</div></div><div class="row"><div>SOLICITANTE: '+esc(x.solicitante)+'</div><div>CATEGORÍA: '+esc(x.categoria)+'</div></div><div class="line"><b>ARTÍCULO / INSUMO</b><b>CANTIDAD / UNIDAD</b><b>OBSERVACIÓN</b></div>'+items.map(a=>'<div class="line"><div>'+esc(a.articulo||'')+'</div><div>'+esc((a.cantidad||'')+' '+(a.unidad||''))+'</div><div></div></div>').join('')+'<div class="row"><div style="grid-column:1/-1">OBSERVACIONES: '+esc(x.observaciones)+'</div></div><div class="sign"><div>Firma solicitante</div><div>Firma entrega depósito</div><div>Firma recepción</div></div></div>';$('print').innerHTML='<div class="print">'+copy('ORIGINAL')+copy('DUPLICADO')+'</div>';$('print').classList.remove('hidden');print();$('print').classList.add('hidden')};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('add').onclick=()=>item();$('reset').onclick=reset;$('search').onclick=search;$('f').onsubmit=async e=>{e.preventDefault();const r=await api('retiro-save',{retiro:data()},true);if(!r.ok)return alert(r.error);alert(r.message+' '+r.id);reset()};(async()=>{const r=await api('retiros-bootstrap');if(!r.ok)return alert(r.error||'No se pudo conectar');opts=r.options;fill('sector',opts.sectores);fill('categoria',opts.categorias);fill('estado',opts.estados);reset()})();
</script></body></html>
