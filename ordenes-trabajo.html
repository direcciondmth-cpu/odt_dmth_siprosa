<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Órdenes de Trabajo | DMTH</title>
<style>
:root{--blue:#0b4f8a;--ink:#17324d;--bg:#eef3f7;--line:#d5e0e8;--ok:#12734c;--gold:#f2ad27}*{box-sizing:border-box}body{margin:0;font:14px/1.4 Arial,sans-serif;background:var(--bg);color:#1d2935}.top{background:var(--blue);color:#fff;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;gap:20px;align-items:center}.top h1{font-size:21px;margin:0}.top p{margin:3px 0 0;opacity:.8}.badge{background:#fff;color:var(--blue);padding:5px 10px;border-radius:20px;font-weight:bold}.app{max-width:1240px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button,.button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold}.tabs button{background:#dbe7f0;color:var(--ink)}.tabs button.active,.button.primary{background:var(--blue);color:#fff}.button.secondary{background:#fff;border:1px solid var(--blue);color:var(--blue)}.button.warn{background:var(--gold);color:#172430}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 3px 12px #17324d0d}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}label{font-weight:bold;color:var(--ink);display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:75px;resize:vertical}.section{margin:20px 0 10px;padding-bottom:7px;border-bottom:2px solid #e4edf4;color:var(--blue);font-size:16px;font-weight:bold}.crew{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:7px}.materials{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:7px}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end;margin-top:20px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th{background:var(--blue);color:#fff;text-align:left;padding:9px;font-size:12px}td{border-bottom:1px solid var(--line);padding:9px;vertical-align:top}.mini{font-size:12px;color:#587086}.status{font-weight:bold}.message{margin-bottom:14px;padding:10px;border-radius:6px;background:#e6f6ed;color:var(--ok);font-weight:bold}.print{padding:20px;background:white;color:#000;max-width:780px;margin:auto}.print-copy{border:1px solid #334155;margin:10px 0 22px}.print-title{background:var(--blue);color:#fff;padding:8px;text-align:center;font-size:16px;font-weight:bold}.print-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #b6c3ce}.print-row div{padding:6px;border-right:1px solid #b6c3ce;min-height:30px}.print-row div:last-child{border-right:0}.material-head,.material-row{display:grid;grid-template-columns:2fr 1fr 1fr;border-top:1px solid #b6c3ce}.material-head{background:#eaf1f6;font-weight:bold}.material-head div,.material-row div{padding:5px;border-right:1px solid #b6c3ce;min-height:27px}.sign{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:40px;text-align:center;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.materials{grid-template-columns:1fr 1fr auto}.toolbar input,.toolbar select{max-width:none;flex:1 1 160px}}@media print{body>*:not(#printView){display:none!important}#printView{display:block!important}.print{max-width:none;padding:0}.tabs,.actions{display:none!important}}
</style></head><body>
<header class="top"><img src="logo-dmth.png" alt="DMTH" style="width:54px;height:54px;object-fit:contain;background:#fff;border-radius:8px;padding:3px"><div><h1>Órdenes de Trabajo</h1><p>DMTH · Dirección de Mantenimiento Técnico Hospitalario · SIPROSA</p></div><span class="badge">SIPROSA</span></header>
<main class="app"><div id="message" class="message hidden"></div><nav class="tabs"><button class="active" data-tab="new">+ Cargar orden</button><button data-tab="manage">Ver y editar órdenes</button></nav>
<section id="new" class="panel"><form id="orderForm"><input id="id" type="hidden"><div class="grid"><div><label>Fecha *</label><input id="fecha" type="date" required></div><div><label>Estado</label><select id="estado"></select></div><div><label>Origen *</label><select id="origen" required></select><button class="button secondary add-list" data-list="origenes" type="button">+ Agregar origen</button></div><div><label>Destino *</label><select id="destino" required></select><button class="button secondary add-list" data-list="destinos" type="button">+ Agregar destino</button></div><div><label>Móvil</label><select id="movil"></select><button class="button secondary add-list" data-list="moviles" type="button">+ Agregar móvil</button></div><div><label>Sección *</label><select id="seccion" required></select><button class="button secondary add-list" data-list="secciones" type="button">+ Agregar sección</button></div><div><label>ID vinculado — letra</label><input id="vincLetra" maxlength="3" placeholder="T / U / A"></div><div><label>ID vinculado — número</label><input id="vincNumero" placeholder="Ej. 10500"></div><div class="full"><label>Tarea a realizar *</label><textarea id="tarea" required></textarea></div></div><div class="section">Cuadrilla</div><div id="crewRows"></div><button id="addCrew" class="button secondary" type="button">+ Agregar integrante</button><div class="section">Materiales</div><div id="materialRows"></div><button id="addMaterial" class="button secondary" type="button">+ Agregar material</button><div class="section">Observaciones</div><textarea id="observaciones"></textarea><div class="actions"><button class="button secondary" type="button" id="reset">Cancelar</button><button class="button primary" type="submit">Guardar orden</button></div></form></section>
<section id="manage" class="panel hidden"><div class="toolbar"><input id="search" placeholder="Buscar por código, destino, tarea o cuadrilla"><select id="filterState"></select><button class="button primary" id="runSearch">Buscar</button></div><div id="summary" class="mini"></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Fecha</th><th>Destino / tarea</th><th>Sección</th><th>Estado</th><th></th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></main><section id="printView" class="hidden"></section>
<script>
// Pegá aquí la URL /exec de Apps Script. Para usarlo dentro de Apps Script, podés dejarla vacía y adaptar api().
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwR7MP7giX05UgRslmsK3_jvUqjQHrobvOxF3RdSiZpEWaSzxvTzhdxlCnXZnEtsCg/exec';let options={},lastOrders=[];
const $=id=>document.getElementById(id);const api=async(action,data,method='GET')=>{let url=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action='+encodeURIComponent(action);let r;if(method==='POST'){r=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify({action,...data})})}else r=await fetch(url);return r.json()};
const message=t=>{$('message').textContent=t;$('message').classList.remove('hidden');setTimeout(()=>$('message').classList.add('hidden'),4000)};
function fill(id,items,blank='Seleccionar…'){const el=$(id);el.innerHTML='<option value="">'+blank+'</option>'+items.map(x=>'<option>'+escapeHtml(x)+'</option>').join('')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function crewRow(value=''){let d=document.createElement('div');d.className='crew';d.innerHTML='<select class="crew-select"><option value="">Seleccionar personal…</option>'+options.personal.map(p=>'<option value="'+escapeHtml(p.etiqueta)+'">'+escapeHtml(p.etiqueta)+'</option>').join('')+'</select><button class="button secondary" type="button">Quitar</button>';d.querySelector('select').value=value;d.querySelector('button').onclick=()=>d.remove();$('crewRows').append(d)}
function materialRow(m={}){let d=document.createElement('div');d.className='materials';d.innerHTML='<input class="mat-name" placeholder="Material"><input class="mat-qty" placeholder="Cantidad"><button class="button secondary" type="button">Quitar</button>';d.querySelector('.mat-name').value=m.nombre||'';d.querySelector('.mat-qty').value=m.cantidad||'';d.querySelector('button').onclick=()=>d.remove();$('materialRows').append(d)}
function getForm(){return {id:$('id').value,fecha:$('fecha').value,origen:$('origen').value,destino:$('destino').value,movil:$('movil').value,seccion:$('seccion').value,tarea:$('tarea').value,vincLetra:$('vincLetra').value,vincNumero:$('vincNumero').value,estado:$('estado').value,observaciones:$('observaciones').value,cuadrilla:[...document.querySelectorAll('.crew-select')].map(x=>x.value).filter(Boolean),materiales:[...document.querySelectorAll('.materials')].map(x=>({nombre:x.querySelector('.mat-name').value,cantidad:x.querySelector('.mat-qty').value})).filter(x=>x.nombre||x.cantidad)}}
function resetForm(){$('orderForm').reset();$('id').value='';$('crewRows').innerHTML='';$('materialRows').innerHTML='';crewRow();materialRow();$('fecha').value=new Date().toISOString().slice(0,10);$('estado').value='PENDIENTE'}
function loadIntoForm(o){tab('new');$('id').value=o.id;$('fecha').value=toIso(o.fecha);['origen','destino','movil','seccion','tarea','vincLetra','vincNumero','estado','observaciones'].forEach(k=>$(k).value=o[k]||'');$('crewRows').innerHTML='';(String(o.cuadrilla||'').split(', ').filter(Boolean)).forEach(crewRow);$('materialRows').innerHTML='';(o.materiales||[]).forEach(materialRow);if(!o.materiales?.length)materialRow();scrollTo({top:0,behavior:'smooth'})}
function toIso(v){let m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):v}
function tab(id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));['new','manage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='manage')searchOrders()}
async function searchOrders(){let r=await api('orders',{q:$('search').value,estado:$('filterState').value});lastOrders=r.orders||[];$('summary').textContent=(r.total||0)+' órdenes encontradas (se muestran las últimas 500).';$('ordersBody').innerHTML=lastOrders.map((o,i)=>'<tr><td><b>'+escapeHtml(o.id)+'</b></td><td>'+escapeHtml(o.fecha)+'</td><td>'+escapeHtml(o.destino)+'<div class="mini">'+escapeHtml(o.tarea)+'</div></td><td>'+escapeHtml(o.seccion)+'</td><td class="status">'+escapeHtml(o.estado)+'</td><td><button class="button secondary" onclick="editOrder('+i+')">Editar</button> <button class="button warn" onclick="printOrder('+i+')">Imprimir</button></td></tr>').join('')}
window.editOrder=i=>loadIntoForm(lastOrders[i]);window.printOrder=i=>{const o=lastOrders[i],mat=[...(o.materiales||[]),...Array(10)].slice(0,10);const copy=label=>'<div class="print-copy"><div class="print-title">ORDEN DE TRABAJO — '+escapeHtml(o.id)+' | '+label+'</div><div class="print-row"><div>DMT — DEPARTAMENTO DE OBRAS</div><div>FECHA: '+escapeHtml(o.fecha)+'</div></div><div class="print-row"><div>ORIGEN: '+escapeHtml(o.origen)+'</div><div><b>EQUIPO DE TRABAJO</b><br>'+escapeHtml(o.cuadrilla)+'</div></div><div class="print-row"><div>DESTINO: '+escapeHtml(o.destino)+'</div><div>SECCIÓN: '+escapeHtml(o.seccion)+'</div></div><div class="print-row"><div>MÓVIL: '+escapeHtml(o.movil)+'</div><div>OBSERVACIONES: '+escapeHtml(o.observaciones)+'</div></div><div class="print-row"><div style="grid-column:1/-1"><b>TAREA:</b> '+escapeHtml(o.tarea)+'</div></div><div class="material-head"><div>Materiales / item</div><div>Cantidad</div><div>Observación</div></div>'+mat.map(x=>'<div class="material-row"><div>'+escapeHtml(x.nombre||'')+'</div><div>'+escapeHtml(x.cantidad||'')+'</div><div></div></div>').join('')+'<div class="sign"><div>Firma y sello<br>supervisor solicitante</div><div>Firma recepción</div><div>Firma y sello<br>depósito</div><div>Conforme efector</div></div></div>'; $('printView').innerHTML='<div class="print">'+copy('ORIGINAL')+copy('DUPLICADO')+'</div>';$('printView').classList.remove('hidden');print();$('printView').classList.add('hidden')};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('addCrew').onclick=()=>crewRow();$('addMaterial').onclick=()=>materialRow();$('reset').onclick=resetForm;$('runSearch').onclick=searchOrders;$('orderForm').onsubmit=async e=>{e.preventDefault();let r=await api('save',{order:getForm()},'POST');if(!r.ok)return alert(r.error);message(r.message+' Código: '+r.id);resetForm()};document.querySelectorAll('.add-list').forEach(b=>b.onclick=async()=>{let value=prompt('Nueva opción:');if(!value)return;let r=await api('list-add',{list:b.dataset.list,value},'POST');if(!r.ok)return alert(r.error);await init();message('Opción agregada.')});
async function init(){let r=await api('bootstrap');if(!r.ok)return alert(r.error||'No se pudo conectar con la planilla.');options=r.options;fill('origen',options.origenes);fill('destino',options.destinos);fill('movil',options.moviles,'Sin especificar');fill('seccion',options.secciones);fill('estado',options.estados);fill('filterState',options.estados,'Todos los estados');resetForm();if(location.hash==='#historial')tab('manage')}init();
</script></body></html>
